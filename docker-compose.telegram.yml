version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: telegram_whisper_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - bot-state-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bot-state-data:
